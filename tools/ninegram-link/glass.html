<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninegram</title>
<style>
  :root {
    color-scheme: dark;
    --text: rgba(255, 255, 255, 0.94);
    --muted: rgba(255, 255, 255, 0.62);
    --danger: #ffb4b4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05070c;
    color: var(--text);
    font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", sans-serif;
  }
  body { overflow: hidden; }
  .bg { position: fixed; inset: 0; overflow: hidden; }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(64px);
    opacity: 0.72;
    animation: drift 22s ease-in-out infinite;
  }
  .o1 { width: 460px; height: 460px; background: #4f86ff; top: -140px; left: -120px; }
  .o2 { width: 420px; height: 420px; background: #8d5cff; right: -140px; bottom: -80px; animation-delay: -8s; }
  .o3 { width: 280px; height: 280px; background: #2ad4c8; top: 42%; left: 28%; opacity: 0.45; animation-delay: -14s; }
  .o4 { width: 220px; height: 220px; background: #ff6eb4; top: 12%; right: 8%; opacity: 0.28; animation-delay: -4s; }
  @keyframes drift {
    50% { transform: translate3d(36px, 28px, 0) scale(1.08); }
  }
  .noise {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.18;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  main {
    position: relative;
    z-index: 1;
    height: 100%;
    overflow: auto;
    padding: 22px 22px 96px;
  }
  .glass {
    position: relative;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.34), rgba(22,28,40,0.72) 18%, rgba(16,20,30,0.78) 100%);
    border-radius: 28px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.62),
      inset 0 -18px 28px rgba(0,0,0,0.12),
      0 18px 44px rgba(0,0,0,0.28);
  }
  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(155deg, rgba(255,255,255,0.92), rgba(255,255,255,0.18) 34%, rgba(255,255,255,0.05) 62%, rgba(255,255,255,0.42));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  header.glass { padding: 22px 22px 18px; }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.03em;
  }
  .sub {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
  }
  .hint {
    margin: 14px 6px 16px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .avatar {
    width: 46px;
    height: 46px;
    flex: none;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 650;
    font-size: 18px;
    background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.08));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .meta { flex: 1; min-width: 0; }
  input.name {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    font-weight: 620;
    padding: 0;
  }
  .id {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
  }
  .card.on .id { color: #b7ffe8; }
  .actions { display: flex; gap: 8px; flex: none; }
  button {
    border: 0;
    cursor: pointer;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 640;
    border-radius: 999px;
    padding: 9px 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.10));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
  }
  button:hover { background: linear-gradient(180deg, rgba(255,255,255,0.40), rgba(255,255,255,0.14)); }
  button:active { transform: scale(0.98); }
  button.danger { color: var(--danger); background: linear-gradient(180deg, rgba(255,90,90,0.22), rgba(255,90,90,0.08)); }
  .empty {
    padding: 28px 22px;
    color: var(--muted);
    line-height: 1.45;
    text-align: center;
  }
  .empty[hidden], .modal[hidden] { display: none; }
  .dock {
    position: fixed;
    z-index: 2;
    left: 22px;
    right: 22px;
    bottom: 18px;
  }
  .status {
    padding: 12px 16px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .status.bad { color: #ffc1c1; }
  .modal {
    position: fixed;
    z-index: 3;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(4, 6, 12, 0.55);
  }
  .sheet { width: min(380px, calc(100% - 48px)); padding: 22px; }
  .sheet h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.02em; }
  .sheet p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; font-size: 14px; }
  .sheet .actions { justify-content: flex-end; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.28);
    border-radius: 99px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
    <div class="orb o4"></div>
    <svg class="noise" xmlns="http://www.w3.org/2000/svg">
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grain)"/>
    </svg>
  </div>
  <main>
    <header class="glass">
      <h1>Ninegram</h1>
      <p class="sub">Аккаунты на этом компьютере</p>
    </header>
    <p class="hint">Подпись можно поменять. «Открыть» запускает AyuGram этого аккаунта.</p>
    <section id="list"></section>
    <section id="empty" class="glass empty" hidden>Пока пусто. Когда перенесёшь аккаунт с телефона, он появится здесь.</section>
  </main>
  <div class="dock">
    <div id="status" class="glass status">Подключаюсь к серверу…</div>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="glass sheet">
      <h2>Удалить аккаунт?</h2>
      <p id="modal-text"></p>
      <div class="actions">
        <button id="cancel" type="button">Отмена</button>
        <button id="confirm" class="danger" type="button">Удалить</button>
      </div>
    </div>
  </div>
  <script>
    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const statusEl = document.getElementById("status");
    const modal = document.getElementById("modal");
    const modalText = document.getElementById("modal-text");
    let pendingPath = "";

    function post(message) {
      if (window.chrome && chrome.webview) chrome.webview.postMessage(message);
    }

    function letter(title) {
      const text = (title || "?").trim();
      return text ? text.charAt(0).toUpperCase() : "?";
    }

    function cardFor(account) {
      const card = document.createElement("article");
      card.className = "card glass" + (account.running ? " on" : "");
      card.dataset.path = account.path;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = letter(account.title);

      const meta = document.createElement("div");
      meta.className = "meta";
      const input = document.createElement("input");
      input.className = "name";
      input.value = account.title || account.id;
      input.spellcheck = false;
      input.addEventListener("input", () => { avatar.textContent = letter(input.value); });
      input.addEventListener("change", () => post({ cmd: "rename", path: account.path, title: input.value.trim() }));
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") input.blur();
      });
      const id = document.createElement("div");
      id.className = "id";
      id.textContent = account.running ? "сейчас открыт" : account.id;
      meta.append(input, id);

      const actions = document.createElement("div");
      actions.className = "actions";
      const open = document.createElement("button");
      open.type = "button";
      open.dataset.act = "open";
      open.textContent = account.running ? "Показать" : "Открыть";
      open.addEventListener("click", () => post({ cmd: "open", path: account.path }));
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "danger";
      remove.textContent = "Удалить";
      remove.addEventListener("click", () => {
        pendingPath = account.path;
        modalText.textContent = "Окно AyuGram закроется. В списке устройств Telegram сессия может остаться, её можно завершить с телефона.";
        modal.hidden = false;
      });
      actions.append(open, remove);
      card.append(avatar, meta, actions);
      return card;
    }

    function render(state) {
      const text = state.status || "";
      statusEl.textContent = text;
      statusEl.classList.toggle("bad", text.indexOf("Ошибка") === 0);
      const accounts = state.accounts || [];
      emptyEl.hidden = accounts.length !== 0;
      const existing = new Map();
      for (const node of listEl.children) existing.set(node.dataset.path, node);
      const seen = new Set();
      for (const account of accounts) {
        seen.add(account.path);
        const node = existing.get(account.path);
        if (!node) {
          listEl.appendChild(cardFor(account));
          continue;
        }
        node.classList.toggle("on", !!account.running);
        const input = node.querySelector("input");
        if (document.activeElement !== input && input.value !== account.title) {
          input.value = account.title;
          node.querySelector(".avatar").textContent = letter(account.title);
        }
        node.querySelector(".id").textContent = account.running ? "сейчас открыт" : account.id;
        node.querySelector("[data-act=open]").textContent = account.running ? "Показать" : "Открыть";
      }
      for (const [path, node] of existing) {
        if (!seen.has(path)) node.remove();
      }
    }

    document.getElementById("cancel").addEventListener("click", () => { modal.hidden = true; });
    document.getElementById("confirm").addEventListener("click", () => {
      modal.hidden = true;
      if (pendingPath) post({ cmd: "delete", path: pendingPath });
      pendingPath = "";
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") modal.hidden = true;
    });

    if (window.chrome && chrome.webview) {
      chrome.webview.addEventListener("message", (event) => {
        const data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
        if (data && data.type === "state") render(data);
      });
    }
  </script>
</body>
</html>
