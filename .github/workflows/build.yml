name: Build iOS IPA

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 180

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select required Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner"
            ls -1 /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bazel
          key: bazel-${{ runner.os }}-x86_64-${{ hashFiles('MODULE.bazel.lock', 'WORKSPACE', 'versions.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-x86_64-

      - name: Build unsigned arm64 IPA
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          export TELEGRAM_FAKE_P12_PASSWORD=ci
          CI_CODESIGNING="$RUNNER_TEMP/fake-codesigning"
          CI_CERTS="$RUNNER_TEMP/fake-certs"
          mkdir -p "$CI_CERTS"
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout "$CI_CERTS/private-key.pem" \
            -out "$CI_CERTS/certificate.pem" \
            -subj '/C=US/O=Telegram FZ-LLC/OU=C67CF9S4VU/CN=Apple Distribution: Telegram FZ-LLC (C67CF9S4VU)' \
            -addext 'keyUsage=critical,digitalSignature' \
            -addext 'extendedKeyUsage=codeSigning'
          PKCS12_ARGS=(
            -export
            -inkey "$CI_CERTS/private-key.pem"
            -in "$CI_CERTS/certificate.pem"
            -out "$CI_CERTS/SelfSigned.p12"
            -passout "pass:${TELEGRAM_FAKE_P12_PASSWORD}"
          )
          openssl pkcs12 -legacy "${PKCS12_ARGS[@]}" || openssl pkcs12 "${PKCS12_ARGS[@]}"
          openssl x509 \
            -in "$CI_CERTS/certificate.pem" \
            -outform DER \
            -out "$CI_CERTS/Public.cer"

          python3 -u build-system/Make/Make.py \
            generate-verification-profiles \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --destination="$CI_CODESIGNING/profiles" \
            --certsPath="$CI_CERTS"
          mkdir -p "$CI_CODESIGNING/certs"
          cp "$CI_CERTS/SelfSigned.p12" "$CI_CERTS/Public.cer" \
            "$CI_CODESIGNING/certs/"

          python3 build-system/Make/ImportCertificates.py \
            --path "$CI_CODESIGNING/certs"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$RUNNER_TEMP/bazel" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath="$CI_CODESIGNING" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --disableExtensions

          mkdir -p build/artifacts
          IPA_PATH="$(find bazel-out -path '*/bin/Telegram/Telegram.ipa' -type f -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::Telegram.ipa was not produced"
            exit 1
          fi

          rm -rf build/unsigned
          mkdir -p build/unsigned
          ditto -x -k "$IPA_PATH" build/unsigned

          while IFS= read -r bundle; do
            codesign --remove-signature "$bundle" 2>/dev/null || true
            rm -rf "$bundle/_CodeSignature"
            rm -f "$bundle/embedded.mobileprovision"
          done < <(find build/unsigned/Payload -depth -type d \( \
            -name '*.app' -o -name '*.appex' -o -name '*.framework' \
          \))

          lipo -archs build/unsigned/Payload/Telegram.app/Telegram | grep -qw arm64
          (
            cd build/unsigned
            ditto -c -k --sequesterRsrc --keepParent \
              Payload ../artifacts/Ninepeaksgram.ipa
          )

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bazel
          key: bazel-${{ runner.os }}-x86_64-${{ hashFiles('MODULE.bazel.lock', 'WORKSPACE', 'versions.json') }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ninepeaksgram-iOS-${{ github.run_number }}
          path: build/artifacts/Ninepeaksgram.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
