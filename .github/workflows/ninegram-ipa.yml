name: Ninegram IPA

on:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
  workflow_dispatch:
    inputs:
      include_extensions:
        description: 'Compile app extensions for signing with a capable Apple Developer profile'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 180

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select required Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner"
            ls -1 /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bazel
          key: bazel-${{ runner.os }}-x86_64-${{ hashFiles('MODULE.bazel.lock', 'WORKSPACE', 'versions.json') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-x86_64-${{ hashFiles('MODULE.bazel.lock', 'WORKSPACE', 'versions.json') }}-
            bazel-${{ runner.os }}-x86_64-

      - name: Build unsigned arm64 IPA
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          NINEGRAM_LINK_READ_SECRET: ${{ secrets.NINEGRAM_LINK_READ_SECRET }}
          NINEGRAM_LINK_PUBLIC_KEY: ${{ secrets.NINEGRAM_LINK_PUBLIC_KEY }}
          INCLUDE_EXTENSIONS: ${{ inputs.include_extensions || false }}
          NINEGRAM_BUNDLE_ID: ${{ vars.NINEGRAM_BUNDLE_ID }}
          NINEGRAM_TEAM_ID: ${{ vars.NINEGRAM_TEAM_ID }}
        run: |
          set -euo pipefail
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          # New workflow run numbers start at 1. Keep the IPA newer than the
          # builds already installed from the old workflow.
          BUILD_NUMBER="$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET + 400))"

          if [[ -z "${TELEGRAM_API_ID}" || -z "${TELEGRAM_API_HASH}" ]]; then
            echo "::error::TELEGRAM_API_ID and TELEGRAM_API_HASH repository secrets are required"
            exit 1
          fi
          if [[ -n "${NINEGRAM_LINK_READ_SECRET:-}" ]]; then
            python3 -c 'import os, pathlib; p = pathlib.Path("submodules/TelegramUI/Sources/NinegramDesktopLink.swift"); p.write_text(p.read_text().replace("NINEGRAM_LINK_READ_SECRET", os.environ["NINEGRAM_LINK_READ_SECRET"]))'
            if [[ -z "${NINEGRAM_LINK_PUBLIC_KEY:-}" ]]; then
              echo "::error::NINEGRAM_LINK_PUBLIC_KEY is required for encrypted device pairing"
              exit 1
            fi
            python3 -c 'import os, pathlib; p = pathlib.Path("submodules/TelegramUI/Sources/NinegramDesktopLink.swift"); p.write_text(p.read_text().replace("NINEGRAM_LINK_PUBLIC_KEY", os.environ["NINEGRAM_LINK_PUBLIC_KEY"]))'
          fi
          export CI_CONFIG="$RUNNER_TEMP/appstore-configuration.json"
          python3 -c 'import json,os; cfg=json.load(open("build-system/appstore-configuration.json")); cfg["api_id"]=os.environ["TELEGRAM_API_ID"]; cfg["api_hash"]=os.environ["TELEGRAM_API_HASH"]; json.dump(cfg, open(os.environ["CI_CONFIG"],"w"), indent="\t"); print("Applied API credentials from secrets")'
          if [[ -n "$NINEGRAM_BUNDLE_ID" || -n "$NINEGRAM_TEAM_ID" ]]; then
            if [[ -z "$NINEGRAM_BUNDLE_ID" || -z "$NINEGRAM_TEAM_ID" ]]; then
              echo "::error::Set both NINEGRAM_BUNDLE_ID and NINEGRAM_TEAM_ID repository variables"
              exit 1
            fi
            python3 -c 'import json,os; p=os.environ["CI_CONFIG"]; cfg=json.load(open(p)); cfg.update(bundle_id=os.environ["NINEGRAM_BUNDLE_ID"], team_id=os.environ["NINEGRAM_TEAM_ID"]); json.dump(cfg, open(p,"w"), indent="\t"); print("Applied custom Apple app identity")'
          fi

          export TELEGRAM_FAKE_P12_PASSWORD=ci
          CI_CODESIGNING="$RUNNER_TEMP/fake-codesigning"
          CI_CERTS="$RUNNER_TEMP/fake-certs"
          mkdir -p "$CI_CERTS"
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout "$CI_CERTS/private-key.pem" \
            -out "$CI_CERTS/certificate.pem" \
            -config build-system/ci-codesign.cnf
          PKCS12_ARGS=(
            -export
            -inkey "$CI_CERTS/private-key.pem"
            -in "$CI_CERTS/certificate.pem"
            -out "$CI_CERTS/SelfSigned.p12"
            -passout "pass:${TELEGRAM_FAKE_P12_PASSWORD}"
          )
          openssl pkcs12 -legacy "${PKCS12_ARGS[@]}" || openssl pkcs12 "${PKCS12_ARGS[@]}"
          openssl x509 \
            -in "$CI_CERTS/certificate.pem" \
            -outform DER \
            -out "$CI_CERTS/Public.cer"
          openssl x509 -in "$CI_CERTS/certificate.pem" -noout -text | tail -n 40

          python3 -u build-system/Make/Make.py \
            generate-verification-profiles \
            --configurationPath="$CI_CONFIG" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --destination="$CI_CODESIGNING/profiles" \
            --certsPath="$CI_CERTS"
          mkdir -p "$CI_CODESIGNING/certs"
          cp "$CI_CERTS/SelfSigned.p12" "$CI_CERTS/Public.cer" \
            "$CI_CODESIGNING/certs/"

          python3 build-system/Make/ImportCertificates.py \
            --path "$CI_CODESIGNING/certs"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CI_CERTS/Public.cer" || true
          security import "$CI_CERTS/SelfSigned.p12" \
            -k ~/Library/Keychains/login.keychain-db \
            -P "$TELEGRAM_FAKE_P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security || true
          echo "All identities:"
          security find-identity -v
          echo "Codesigning identities:"
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -q 'Apple Distribution: Telegram FZ-LLC'; then
            echo "::error::Fake codesigning identity is not visible to codesign"
            exit 1
          fi
          BUILD_OPTIONS=(--continueOnError)
          if [[ "$INCLUDE_EXTENSIONS" != "true" ]]; then
            BUILD_OPTIONS+=(--disableExtensions)
          fi
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$RUNNER_TEMP/bazel" \
            build \
            --configurationPath="$CI_CONFIG" \
            --codesigningInformationPath="$CI_CODESIGNING" \
            --configuration=sideload_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            "${BUILD_OPTIONS[@]}"

          mkdir -p build/artifacts
          IPA_PATH=""
          for candidate in bazel-bin/Telegram/Swiftgram.ipa bazel-out/*/bin/Telegram/Swiftgram.ipa; do
            if [[ -e "$candidate" ]]; then
              IPA_PATH="$candidate"
              break
            fi
          done
          if [[ -z "$IPA_PATH" ]]; then
            IPA_PATH="$(find -L bazel-bin bazel-out -name 'Swiftgram.ipa' -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::Swiftgram.ipa was not produced"
            find -L bazel-bin bazel-out -name '*.ipa' -print || true
            exit 1
          fi
          echo "Using IPA at $IPA_PATH"

          rm -rf build/unsigned
          mkdir -p build/unsigned
          ditto -x -k "$IPA_PATH" build/unsigned

          while IFS= read -r bundle; do
            codesign --remove-signature "$bundle" 2>/dev/null || true
            rm -rf "$bundle/_CodeSignature"
            rm -f "$bundle/embedded.mobileprovision"
          done < <(find build/unsigned/Payload -depth -type d \( \
            -name '*.app' -o -name '*.appex' -o -name '*.framework' \
          \))

          APP_PATH="$(find build/unsigned/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          lipo -archs "$APP_PATH/$APP_EXECUTABLE" | grep -qw arm64
          (
            cd build/unsigned
            ditto -c -k --sequesterRsrc --keepParent \
              Payload ../artifacts/Ninepeaksgram.ipa
          )

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bazel
          key: bazel-${{ runner.os }}-x86_64-${{ hashFiles('MODULE.bazel.lock', 'WORKSPACE', 'versions.json') }}-${{ github.run_id }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ninepeaksgram-iOS-${{ github.run_number }}
          path: build/artifacts/Ninepeaksgram.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
